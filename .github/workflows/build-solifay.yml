name: Build Solifay APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to build
        required: true
        default: solifay-ui
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install Android SDK Platform
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37.0"

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          sdkmanager --channel=0 "ndk;29.0.14206865"

          echo "===== Installed NDK directories ====="
          find "$ANDROID_SDK_ROOT/ndk" -maxdepth 2 -type f -name source.properties -print 2>/dev/null || true

          echo "===== Android SDK NDK directory ====="
          ls -la "$ANDROID_SDK_ROOT/ndk" || true

          echo "===== NDK package info ====="
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed \
            | grep "ndk;" || true

          NDK_DIR="$ANDROID_SDK_ROOT/ndk/29.0.14206865"

          if [ ! -d "$NDK_DIR" ]; then
            echo "ERROR: Expected NDK directory was not found."
            echo "Searching for installed NDK directories..."
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type d -name "29.0.14206865" -print
            exit 1
          fi

          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Verify Android SDK and NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo "===== SDK platforms ====="
          ls -la "$ANDROID_SDK_ROOT/platforms" || true

          echo "===== NDK ====="
          ls -la "$ANDROID_NDK_HOME" || true

          if [ ! -f "$ANDROID_NDK_HOME/source.properties" ]; then
            echo "ERROR: NDK source.properties not found."
            exit 1
          fi

          cat "$ANDROID_NDK_HOME/source.properties"

      - name: Build libhevtun
        shell: bash
        run: |
          set -e
          chmod +x compile-hevtun.sh
          bash compile-hevtun.sh

      - name: Copy libhevtun
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/V2rayNG/app/libs"

          cp -r "$GITHUB_WORKSPACE/libs/"* \
            "$GITHUB_WORKSPACE/V2rayNG/app/libs/"

      - name: Get AndroidLibXrayLite tag
        id: xray_tag
        shell: bash
        run: |
          set -e

          cd AndroidLibXrayLite

          CURRENT_TAG="$(git describe --tags --abbrev=0)"

          echo "AndroidLibXrayLite tag: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ steps.xray_tag.outputs.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > "$GITHUB_WORKSPACE/V2rayNG/local.properties"

          chmod +x "$GITHUB_WORKSPACE/V2rayNG/gradlew"

      - name: Build Solifay Play Store Debug APK
        working-directory: V2rayNG
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assemblePlaystoreDebug

      - name: List generated APKs
        shell: bash
        run: |
          set -e

          find "$GITHUB_WORKSPACE/V2rayNG/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Solifay APK
        uses: actions/upload-artifact@v7
        with:
          name: solifay-playstore-debug
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
