name: Build Solifay APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to build
        required: true
        default: solifay-ui
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout the requested Solifay branch + submodules
      # ---------------------------------------------------------
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Java 21
      # ---------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ---------------------------------------------------------
      # 3. Setup Android command-line tools only
      #    Do NOT ask setup-android to install API 37 here.
      # ---------------------------------------------------------
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: ''

      # ---------------------------------------------------------
      # 4. Install Android SDK Platform + Platform Tools
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --update

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37"

      # ---------------------------------------------------------
      # 5. Install NDK required by libhevtun
      # ---------------------------------------------------------
      - name: Install NDK 29.0.14206865
        shell: bash
        run: |
          set -e

          yes | sdkmanager \
            --channel=0 \
            "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6. Build hev-socks5-tunnel native library
      # ---------------------------------------------------------
      - name: Build libhevtun
        shell: bash
        run: |
          set -e
          bash compile-hevtun.sh

      # ---------------------------------------------------------
      # 7. Copy generated native libraries into Android project
      # ---------------------------------------------------------
      - name: Copy libhevtun
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/V2rayNG/app/libs"
          cp -r "$GITHUB_WORKSPACE/libs/"* \
            "$GITHUB_WORKSPACE/V2rayNG/app/libs/"

      # ---------------------------------------------------------
      # 8. Find the AndroidLibXrayLite tag
      # ---------------------------------------------------------
      - name: Get AndroidLibXrayLite tag
        id: xray_tag
        shell: bash
        run: |
          set -e

          cd AndroidLibXrayLite

          CURRENT_TAG="$(git describe --tags --abbrev=0)"

          echo "AndroidLibXrayLite tag: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 9. Download libv2ray.aar
      # ---------------------------------------------------------
      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ steps.xray_tag.outputs.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      # ---------------------------------------------------------
      # 10. Prepare Android local.properties
      # ---------------------------------------------------------
      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" \
            > "$GITHUB_WORKSPACE/V2rayNG/local.properties"

          chmod +x "$GITHUB_WORKSPACE/V2rayNG/gradlew"

      # ---------------------------------------------------------
      # 11. Make sure Gradle can see the installed SDK
      # ---------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          sdkmanager --list | head -n 80

      # ---------------------------------------------------------
      # 12. Build Solifay Play Store Debug APK
      # ---------------------------------------------------------
      - name: Build Play Store Debug APK
        working-directory: V2rayNG
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assemblePlaystoreDebug

      # ---------------------------------------------------------
      # 13. Show generated APKs
      # ---------------------------------------------------------
      - name: List generated APKs
        shell: bash
        run: |
          set -e

          find \
            "$GITHUB_WORKSPACE/V2rayNG/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      # ---------------------------------------------------------
      # 14. Upload APK as GitHub Artifact
      # ---------------------------------------------------------
      - name: Upload Solifay APK
        uses: actions/upload-artifact@v7
        with:
          name: solifay-playstore-debug
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
