name: Build Solifay APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: solifay-ui
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Solifay
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          sed -i '10i\
\
            ndkVersion = "29.0.14206865"' \
            "${{ github.workspace }}/V2rayNG/app/build.gradle.kts"

      - name: Restore cached libhevtun
        id: cache-libhevtun
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          bash compile-hevtun.sh

      - name: Save libhevtun cache
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        shell: bash
        run: |
          set -e
          cp -r "${{ github.workspace }}/libs" "${{ github.workspace }}/V2rayNG/app"

      - name: Get AndroidLibXrayLite tag
        id: xray
        shell: bash
        run: |
          set -e

          cd AndroidLibXrayLite

          CURRENT_TAG="$(git describe --tags --abbrev=0)"

          echo "Using AndroidLibXrayLite tag: ${CURRENT_TAG}"
          echo "CURRENT_TAG=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ steps.xray.outputs.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          cd "${{ github.workspace }}/V2rayNG"

          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          chmod 755 gradlew

      - name: Build Solifay Debug APK
        working-directory: V2rayNG
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assemblePlaystoreDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          find "${{ github.workspace }}/V2rayNG/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Solifay APK
        uses: actions/upload-artifact@v7
        with:
          name: solifay-debug-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
