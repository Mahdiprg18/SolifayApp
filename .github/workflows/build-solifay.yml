name: Build Solifay APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to build
        required: true
        default: solifay-ui
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        shell: bash
        run: |
          echo "y" | sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build libhevtun
        shell: bash
        run: |
          bash compile-hevtun.sh

      - name: Copy libhevtun
        shell: bash
        run: |
          cp -r "$GITHUB_WORKSPACE/libs" "$GITHUB_WORKSPACE/V2rayNG/app/"

      - name: Get AndroidLibXrayLite tag
        id: xray_tag
        shell: bash
        run: |
          cd AndroidLibXrayLite
          CURRENT_TAG="$(git describe --tags --abbrev=0)"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ steps.xray_tag.outputs.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Prepare Android project
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "$GITHUB_WORKSPACE/V2rayNG/local.properties"
          chmod +x "$GITHUB_WORKSPACE/V2rayNG/gradlew"

      - name: Build Play Store Debug APK
        working-directory: V2rayNG
        shell: bash
        run: |
          ./gradlew --no-daemon :app:assemblePlaystoreDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: solifay-playstore-debug
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7